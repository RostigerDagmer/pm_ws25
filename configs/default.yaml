seed: 1
discovery:
  methods: ["inductive"] #, "heuristic"] # either a DISCOVERY_METHOD variant or a list of any in the set { "inductive","heuristic", "alpha", "alpha_plus", "ilp" }
  params: # method-specific lists of parameters (only eligible will be applied to a method)
    noise_threshold: [0.0, 0.1, 0.2, 0.3]
    dependency_threshold: [0.0, 0.1, 0.2]
    and_threshold: [0.0, 0.2, 0.35, 0.5]
    loop_two_threshold: [0.0, 0.1, 0.2, 0.3]
    disable_fallthroughs: true

  samplers: # Parameters for the VariantRandomDistributionSampler
    - name: variant1
      n_subsets: 100 # number of subsets to sample -> number of models that discovery can produce (per unique set of discovery parameters)
      min_len_subset: 30 # minimum length of each subset
      max_len_subset: 150 # maximum length of each subset

      len_distribution: # distribution prior for the length of each subset
        type: Exponential
        args:
          rate: 0.01

      freq_distribution: # distribution prior for the frequency of each variant within a subset
        type: Normal
        args:
          mean: 10.0
          std: 4.0

    - name: variant2
      n_subsets: 100 # number of subsets to sample -> number of models that discovery can produce (per unique set of discovery parameters)
      min_len_subset: 50 # minimum length of each subset
      max_len_subset: 500 # maximum length of each subset

      len_distribution: # distribution prior for the length of each subset
        type: Exponential
        args:
          rate: 0.005

      freq_distribution: # distribution prior for the frequency of each variant within a subset
        type: Normal
        args:
          mean: 5.0
          std: 2.0

    - name: variant3
      n_subsets: 20 # number of subsets to sample -> number of models that discovery can produce (per unique set of discovery parameters)
      min_len_subset: 200 # minimum length of each subset
      max_len_subset: 1000 # maximum length of each subset

      len_distribution: # distribution prior for the length of each subset
        type: Exponential
        args:
          rate: 0.0005

      freq_distribution: # distribution prior for the frequency of each variant within a subset
        type: Normal
        args:
          mean: 5.0
          std: 2.0

    - name: variant4
      n_subsets: 50 # number of subsets to sample -> number of models that discovery can produce (per unique set of discovery parameters)
      min_len_subset: 15 # minimum length of each subset
      max_len_subset: 100 # maximum length of each subset

      len_distribution: # distribution prior for the length of each subset
        type: Exponential
        args:
          rate: 0.01

      freq_distribution: # distribution prior for the frequency of each variant within a subset
        type: Exponential
        args:
          rate: 0.2
    
  
deduplication:
  config:
    # Stage 1: Label-based prefilter (similarity, higher = more similar)
    label_similarity_threshold: 0.95

    # Stage 2: Combined edge+feature comparison (similarity, higher = more similar)
    combined_similarity_threshold: 0.95

    # Enable/disable stages
    enable_stage1: True
    enable_stage2: True

    verbose: True
  force_recompute: False # whether to force recomputation of deduplication even if results exist

alignment:
  runs: 5 # number of alignment runs per model x trace combination
  workers: 0 # number of parallel workers (0 = all threads)
  write_batch_size: 100 # number of alignments to buffer before writing to disk
  variants: A_STAR # either a AlignerSpec variant or a list of pm4py.algo.conformance.alignments.variants.Variants variants
  sampler:
    type: SubsetAwarePerturbedTraceSampler # class name of the trace sampler used during alignment runs
    slice: # optional slice of traces to align (for testing/debugging)
      from: 0
      to: 20
    args:
      pick_random: true
      noise_params:
        p_insert: 0.05
        p_delete: 0.02
        p_swap: 0.05